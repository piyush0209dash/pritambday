<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>For Maggie 🍜⚽</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@300;400;500&family=Noto+Sans+Devanagari:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="fl"></div>
<div id="loading"><div class="lball"></div><div class="lh">Welcome to Maggie's World</div><div class="ls">loading the pitch...</div><div id="pb"><div id="pf"></div></div></div>
<div id="rl">THE TUNNEL</div>
<canvas id="mm"></canvas>
<div id="xh"></div>
<div id="ip">[E] Interact</div>
<div id="ht">left stick: move · right stick: look · E / tap to interact</div>
<div id="jl"><div class="jb"><div class="jk" id="jlk"></div></div></div>
<div id="jr"><div class="jb"><div class="jk" id="jrk"></div></div></div>
<div id="go">
  <div id="gt"></div><div id="gs"></div>
  <canvas id="gc"></canvas><div id="mg"></div><div id="qw"></div>
  <div id="gsc"></div><div id="gm"></div>
  <button id="gcl">LEAVE GAME</button>
</div>
<div id="bu"><div id="bp"><div id="bb"><div id="bc"></div></div></div></div>
<div id="roast-popup">
  <div id="roast-box">
    <div id="roast-noodle">🍜</div>
    <div id="roast-title">SECRET FOUND 👀</div>
    <div id="roast-text"></div>
    <button id="roast-close" onclick="document.getElementById('roast-popup').style.display='none';gameActive=false;document.getElementById('jl').style.opacity='1';document.getElementById('jr').style.opacity='1'">OKAY OKAY 😭</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="script.js"></script>
</body>
</html>
